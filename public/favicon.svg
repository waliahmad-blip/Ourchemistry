<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff8fb2"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff8fb2"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#04060f" stroke="url(#g)" stroke-width="2"/>
  <!-- two orbiting elements -->
  <circle cx="24" cy="26" r="9" fill="url(#orb)" opacity="0.95"/>
  <circle cx="40" cy="38" r="9" fill="url(#orb)" opacity="0.75"/>
  <!-- bond line -->
  <line x1="24" y1="26" x2="40" y2="38" stroke="#ffd7a1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- electron spark -->
  <circle cx="32" cy="32" r="3" fill="#ffd7a1"/>
  <!-- orbital ring -->
  <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="url(#g)" stroke-width="1.6" opacity="0.8" transform="rotate(-24 32 32)"/>
</svg>
